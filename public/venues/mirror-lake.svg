<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <!-- Crossed tennis racquets -->
  <g stroke="#1c1a17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left racquet -->
    <g transform="rotate(-20 70 70)">
      <ellipse cx="70" cy="50" rx="28" ry="34" fill="#ece4d0" />
      <!-- Strings -->
      <line x1="50" y1="40" x2="90" y2="40" stroke-width="1.2" />
      <line x1="48" y1="50" x2="92" y2="50" stroke-width="1.2" />
      <line x1="50" y1="60" x2="90" y2="60" stroke-width="1.2" />
      <line x1="60" y1="22" x2="60" y2="80" stroke-width="1.2" />
      <line x1="70" y1="18" x2="70" y2="82" stroke-width="1.2" />
      <line x1="80" y1="22" x2="80" y2="80" stroke-width="1.2" />
      <!-- Handle -->
      <line x1="70" y1="84" x2="70" y2="125" stroke-width="5" />
      <!-- Grip wrap -->
      <line x1="63" y1="105" x2="77" y2="105" stroke="#e07d2f" stroke-width="2" />
      <line x1="63" y1="112" x2="77" y2="112" stroke="#e07d2f" stroke-width="2" />
      <line x1="63" y1="119" x2="77" y2="119" stroke="#e07d2f" stroke-width="2" />
    </g>
    <!-- Right racquet -->
    <g transform="rotate(20 130 70)">
      <ellipse cx="130" cy="50" rx="28" ry="34" fill="#ece4d0" />
      <line x1="110" y1="40" x2="150" y2="40" stroke-width="1.2" />
      <line x1="108" y1="50" x2="152" y2="50" stroke-width="1.2" />
      <line x1="110" y1="60" x2="150" y2="60" stroke-width="1.2" />
      <line x1="120" y1="22" x2="120" y2="80" stroke-width="1.2" />
      <line x1="130" y1="18" x2="130" y2="82" stroke-width="1.2" />
      <line x1="140" y1="22" x2="140" y2="80" stroke-width="1.2" />
      <line x1="130" y1="84" x2="130" y2="125" stroke-width="5" />
      <line x1="123" y1="105" x2="137" y2="105" stroke="#d4523c" stroke-width="2" />
      <line x1="123" y1="112" x2="137" y2="112" stroke="#d4523c" stroke-width="2" />
      <line x1="123" y1="119" x2="137" y2="119" stroke="#d4523c" stroke-width="2" />
    </g>
    <!-- Tennis ball at intersection -->
    <circle cx="100" cy="78" r="9" fill="#e9b941" stroke="#1c1a17" stroke-width="2" />
    <path d="M 92 75 Q 100 80 108 75" stroke="#1c1a17" stroke-width="1.2" fill="none" />
    <path d="M 92 81 Q 100 76 108 81" stroke="#1c1a17" stroke-width="1.2" fill="none" />
  </g>
</svg>
